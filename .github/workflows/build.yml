name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log || {
            { grep -E "^e: " build.log; grep -A6 "What went wrong" build.log; } | grep -v "^> Task" | head -40 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
            exit 1
          }

      - name: Zip APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/cincin/debug/app-cincin-debug.apk out/CincinLangkah.apk
          cp app/build/outputs/apk/lige/debug/app-lige-debug.apk out/LigePantau.apk
          cd out && zip -9 CincinLangkah.zip CincinLangkah.apk && zip -9 LigePantau.zip LigePantau.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CincinLangkah
          path: out/*.zip

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cincin Langkah build ${{ github.run_number }}
          files: |
            out/CincinLangkah.zip
            out/LigePantau.zip
