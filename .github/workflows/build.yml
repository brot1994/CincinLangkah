name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle --no-daemon assembleDebug

      - name: Zip APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/CincinLangkah.apk
          cd out && zip -9 CincinLangkah.zip CincinLangkah.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CincinLangkah
          path: out/CincinLangkah.zip

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Cincin Langkah build ${{ github.run_number }}
          files: out/CincinLangkah.zip
